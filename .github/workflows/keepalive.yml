# Keep the free Supabase project awake (it pauses after 7 days without traffic).
# Runs every day at 06:00 Hong Kong time; can also be started by hand from the Actions tab.
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC = 06:00 HKT
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -H "apikey: sb_publishable_WjLbED49XBNb3SuSk-jJAA_JzkisijZ" \
            "https://tniqkwtaxrzwhjqrsiqg.supabase.co/rest/v1/rpc/ping"
          echo
          echo "Supabase is awake."
